name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (vX.Y.Z or X.Y.Z)
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Install
        run: npm ci
      - name: Syntax check
        run: node --check app.js
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: node --test 'test/*.test.js'
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [[ "$tag" != v* ]]; then
            tag="v$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify version
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          tag_version="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg" ]; then
            echo "Tag $tag does not match package.json version $pkg"
            exit 1
          fi
      - name: Prepare release notes
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          mkdir -p dist

          if [ -s RELEASE_NOTES.md ]; then
            awk -v tag="$tag" '
              $0 == "# " tag { found = 1; print; next }
              found && /^# v[0-9]+\.[0-9]+\.[0-9]+/ { exit }
              found { print }
              END { if (!found) exit 1 }
            ' RELEASE_NOTES.md > dist/release-notes.md || {
              echo "RELEASE_NOTES.md does not contain a # ${tag} section"
              exit 1
            }
          fi
      - name: Build single-file bundle
        run: |
          mkdir -p dist
          ver="${{ steps.tag.outputs.tag }}"
          ver="${ver#v}"

          # 在 app.js 中预先注入版本号（替换 'standalone' 字面量）
          sed -i "s/^let VERSION = 'standalone'/let VERSION = '${ver}'/" app.js
          grep -q "let VERSION = '${ver}'" app.js || { echo "version injection failed"; exit 1; }

          # 用 esbuild 把所有 npm 依赖 bundle 进单文件（shebang 由 app.js 头部自带）。
          # 这样 docker-aria2 等场景下 curl 下来的 aria2b 不需要 node_modules 即可运行。
          # esbuild 已经作为 devDependency 装好（npm ci 走 actions/setup-node 缓存），
          # 这里直接调本地版本，避免每次 release 都从 npm registry 拉一遍。
          npx esbuild app.js \
            --bundle --platform=node --target=node22 \
            --format=cjs --legal-comments=inline \
            --outfile=dist/aria2b
          chmod +x dist/aria2b

          # 自检：单文件版能在不依赖 node_modules 的环境下跑起来
          # （cd 到 /tmp 避免意外解析到项目里的 node_modules）
          rm -rf /tmp/aria2b-selfcheck && mkdir /tmp/aria2b-selfcheck
          cp dist/aria2b /tmp/aria2b-selfcheck/aria2b
          (cd /tmp/aria2b-selfcheck && node aria2b -v)
          (cd /tmp/aria2b-selfcheck && node aria2b -h > /dev/null)

          # npm tarball（供 npm 全局安装的用户）
          npm pack --silent
          sha256sum dist/aria2b > dist/aria2b.sha256
          sha256sum aria2b-*.tgz > dist/aria2b.tgz.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # 优先用仓库里的 RELEASE_NOTES.md 当前 tag 段落作为 release body；缺失时退回自动生成。
          # 这样每次发版的更新说明在 commit 里就是 reviewable 的，不依赖 GH 自动归并。
          if [ -s dist/release-notes.md ]; then
            gh release create "$tag" \
              dist/aria2b \
              aria2b-*.tgz \
              dist/*.sha256 \
              --title "$tag" \
              --notes-file dist/release-notes.md
          else
            gh release create "$tag" \
              dist/aria2b \
              aria2b-*.tgz \
              dist/*.sha256 \
              --title "$tag" \
              --generate-notes
          fi
